function mk(ci,side,cpu){const c=C[ci];return{c,ci,x:side?720:240,y:GY,vx:0,vy:0,face:side?-1:1,hp:c.hp,max:c.hp,dh:c.hp,en:50,at:null,hit:0,blk:0,slow:0,stun:0,combo:0,ct:0,cpu,side,w:0,ko:0,wins:0,k:side?K2:K1,bk:0}}
function spark(x,y,col,n,sp=7){for(let i=0;i<n;i++){const a=Math.random()*6.3,s=rnd(1,sp);pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:rnd(15,35),m:35,c:col,s:rnd(2,5),g:.25})}}
function txt(x,y,s,c){tx.push({x,y,s,c,l:50})}
function startAtk(f,k){if(f.k)delete pr[f.k[k]];const c=f.c;
if(k=='p')f.at={k,t:0,dur:13,h0:3,h1:7,dmg:6,rng:75,kb:5,st:12};
else if(k=='k')f.at={k,t:0,dur:22,h0:7,h1:11,dmg:11,rng:100,kb:10,st:18};
else{const s=c[k];f.en-=s.cost;if(s.t=='p')f.at={k,t:0,dur:28,fire:10,s};else{f.at={k,t:0,dur:34,h0:6,h1:20,dmg:s.dmg,rng:70,kb:s.kb,st:26,dash:s.dist/14};SFX.boom()}}
SFX.wh()}
function fire(f,s){for(let i=0;i<(s.cnt||1);i++){const o=i-((s.cnt||1)-1)/2;pj.push({x:f.x+f.face*45,y:f.y-115+o*(s.spr||0),vx:f.face*s.sp,vy:o*(s.vy||0)*-1,dmg:s.dmg,col:s.col,sz:s.sz,eff:s.eff,o:f,dir:f.face,l:90})}s.t=='p'&&(f.c.h=='fl'||f.c.h=='bw'?SFX.zap():SFX.laser());spark(f.x+f.face*45,f.y-115,s.col,10)}
function hurt(a,t,dmg,kb,stn,big,eff,dir){if(t.ko)return;const d=dmg*(.7+a.c.pow*.06);
if(t.blk&&t.face==-dir){t.hp-=d*.12;t.vx=dir*kb*.4;spark(t.x+t.face*28,t.y-100,'#9cf',10);SFX.blk();t.en=Math.min(100,t.en+3);shake=3;return}
t.hp-=d*(1.35-t.c.def*.06);t.hit=stn;t.vx=dir*kb;if(big)t.vy=-8;t.at=null;a.combo++;a.ct=100;a.en=Math.min(100,a.en+4);t.en=Math.min(100,t.en+3);
if(eff=='stun')t.stun=50;if(eff=='slow')t.slow=180;
hs=big?9:4;shake=big?16:7;spark(t.x,t.y-100,big?'#ffb030':'#fff',big?24:12,big?11:7);big?SFX.big():SFX.hit();txt(t.x,t.y-170,Math.round(d),big?'#fc3':'#fff');
if(big){pt.push({x:t.x,y:t.y-100,vx:0,vy:0,l:12,m:12,c:'#fff',s:40,g:0,ring:1})}}
function chk(f,o,a){const dx=(o.x-f.x)*f.face;if(dx>-25&&dx<a.rng+28&&Math.abs(o.y-f.y)<115){a.done=1;hurt(f,o,a.dmg,a.kb,a.st,a.k!='p',a.eff,f.face);if(a.k=='s2')f.vx=0}}
function upd(f,o,inp){const c=f.c,gr=f.y>=GY;f.en=Math.min(100,f.en+.07);if(f.ct>0&&--f.ct==0)f.combo=0;f.slow>0&&f.slow--;f.stun>0&&f.stun--;
if(f.ko){f.ko=Math.min(1,f.ko+.04);f.vx*=.92}
else if(f.hit>0){f.hit--;f.vx*=.9}
else if(f.stun>0)f.vx*=.8;
else{f.blk=gr&&inp.d&&!f.at?1:0;const sp=c.spd*.8*(f.slow>0?.4:1);
if(f.at){const a=f.at;a.t++;if(a.k=='s2'&&a.dash){if(a.t>=6&&a.t<=20&&!a.done){f.vx=f.face*a.dash;f.vy=Math.min(f.vy,0)*.5;if(a.t%3==0)spark(f.x,f.y-70,c.glow,3,3)}else f.vx*=.6}else f.vx*=.75;
if(a.fire&&a.t==a.fire)fire(f,a.s);if(a.h0!=null&&a.t>=a.h0&&a.t<=a.h1&&!a.done)chk(f,o,a);if(f.at&&a.t>=a.dur)f.at=null}
else{if(gr&&!f.blk)f.face=o.x>f.x?1:-1;f.vx=f.blk?0:((inp.r?1:0)-(inp.l?1:0))*sp;
if(inp.u&&gr&&!f.blk){f.vy=-16;SFX.jmp()}
if(!f.blk){if(inp.p)startAtk(f,'p');else if(inp.k)startAtk(f,'k');else if(inp.s1&&f.en>=c.s1.cost)startAtk(f,'s1');else if(inp.s2&&f.en>=c.s2.cost)startAtk(f,'s2')}}}
f.w+=Math.abs(f.vx)*.09;f.vy+=.9;f.x+=f.vx;f.y+=f.vy;if(f.y>=GY){f.y=GY;f.vy=0}f.x=Math.max(45,Math.min(W-45,f.x))}
function human(f){const k=f.k,e=x=>pr[x]!=null&&tick-pr[x]<8;return{l:keys[k.l],r:keys[k.r],u:keys[k.u],d:keys[k.d],p:e(k.p),k:e(k.k),s1:e(k.s1),s2:e(k.s2)}}
function ai(f,o){const i={},d=Math.abs(o.x-f.x),dir=o.x>f.x;if(f.bk>0){f.bk--;i.d=1;return i}
if(o.at&&d<140&&Math.random()<.05){f.bk=18+Math.random()*14;return i}
if(d>170){dir?i.r=1:i.l=1;if(Math.random()<.02&&f.en>=f.c.s1.cost)i.s1=1;else if(Math.random()<.006)i.u=1;else if(Math.random()<.006&&f.en>=f.c.s2.cost)i.s2=1}
else if(d>105){dir?i.r=1:i.l=1;if(Math.random()<.04)i.k=1}
else{const r=Math.random();if(r<.07)i.p=1;else if(r<.1)i.k=1;else if(r<.113&&f.en>=f.c.s2.cost)i.s2=1;else if(r<.125)dir?i.l=1:i.r=1;else if(r<.13)i.u=1}return i}
function resetRound(){P.forEach(f=>{const s=f.side;Object.assign(f,{x:s?720:240,y:GY,vx:0,vy:0,face:s?-1:1,hp:f.max,dh:f.max,en:50,at:null,hit:0,blk:0,slow:0,stun:0,combo:0,ct:0,ko:0,bk:0})});pj=[];pt=[];tx=[];st='intro';sT=0;tm=60;SFX.ui()}
function endRound(w,txt_){st='end';sT=0;P.forEach(f=>{if(f.hp<=0){f.hp=0;f.ko=.01}});w&&w.wins++;P.er=w;P.et=txt_;SFX.ko()}
function step(){tick++;if(mode!='fight')return;if(hs>0){hs--;return}if(st=='end'&&sT<70&&tick%2)return;sT++;
if(st=='intro'&&sT==90){st='fight';sT=0;SFX.fight()}
for(const f of P){const o=P[1-f.side];upd(f,o,st=='fight'?(f.cpu?ai(f,o):human(f)):{})}
const a=P[0],b=P[1];if(!a.ko&&!b.ko&&Math.abs(a.x-b.x)<46&&Math.abs(a.y-b.y)<60){const s=a.x<b.x?-1:1;a.x+=s*2;b.x-=s*2}
if(st=='fight'){tm-=1/60;if(a.hp<=0||b.hp<=0)endRound(a.hp>b.hp?a:b.hp>a.hp?b:null,'K.O.!');else if(tm<=0)endRound(a.hp/a.max>b.hp/b.max?a:b,'ZAMAN!')}
if(st=='end'&&sT>190){const w=P.find(f=>f.wins>=2);if(w)gameOver(w);else{rd++;resetRound()}}
for(const p of pj){p.x+=p.vx;p.y+=p.vy;p.l--;if(tick%2)pt.push({x:p.x,y:p.y,vx:rnd(-1,1),vy:rnd(-1,1),l:14,m:14,c:p.col,s:p.sz*.8,g:0});const t=P[1-p.o.side];
if(!t.ko&&Math.abs(p.x-t.x)<38&&p.y>t.y-170&&p.y<t.y+5){hurt(p.o,t,p.dmg,6,14,false,p.eff,p.dir);spark(p.x,p.y,p.col,14);p.l=0;if(p.o.c.h=='iron')SFX.boom()}if(p.x<-20||p.x>W+20)p.l=0}pj=pj.filter(p=>p.l>0);
for(const p of pt){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--}pt=pt.filter(p=>p.l>0);for(const t of tx){t.y-=1;t.l--}tx=tx.filter(t=>t.l>0);shake*=.86;for(const f of P)f.dh+=(f.hp-f.dh)*.06}
function gameOver(w){mode='over';music(0);$('#wt').textContent=w.c.n+' KAZANDI!';$('#end').hidden=0;SFX.ok()}
// ---------- RENDER ----------
function bar(x,y,w,h,p,c,r){g.fillStyle=c;g.fillRect(r?x+w*(1-p):x,y,w*Math.max(0,p),h)}
function hud(){P.forEach((f,i)=>{const w=390,x=i?W-30-w:30;g.fillStyle='#000a';g.fillRect(x-4,16,w+8,30);bar(x,20,w,22,f.dh/f.max,'#ffe8e8',i);bar(x,20,w,22,f.hp/f.max,f.hp/f.max>.3?'#34d058':'#ee3030',i);
g.fillStyle='#000a';g.fillRect(x,48,w*.7*1,9);bar(x,48,w*.7,9,f.en/100,f.en>=30?'#3aa0ff':'#357',0);if(i){g.fillStyle='#000a';g.fillRect(x+w*.3,48,w*.7,9);bar(x+w*.3,48,w*.7,9,f.en/100,f.en>=30?'#3aa0ff':'#357',1)}
g.font='italic bold 22px Impact';g.fillStyle='#fff';g.textAlign=i?'right':'left';g.fillText(f.c.n+(f.cpu?' (CPU)':''),i?x+w:x,82);for(let k=0;k<2;k++){circ((i?x+w-8-k*20:x+8+k*20),96,6,k<f.wins?'#fc3':'#333')}
if(f.combo>1){g.font='bold 30px Impact';g.fillStyle='#fc3';g.fillText(f.combo+' HIT!',i?x+w:x,140)}});
g.textAlign='center';g.fillStyle='#000a';g.fillRect(W/2-34,14,68,46);g.font='bold 36px Impact';g.fillStyle=tm<10?'#f44':'#fff';g.fillText(Math.max(0,Math.ceil(tm)),W/2,52)}
function banner(s,c,sz){const e=Math.min(1,sT/12);g.save();g.translate(W/2,230);g.scale(1+(1-e)*1.5,1+(1-e)*1.5);g.globalAlpha=e;g.font=`italic ${sz}px Impact`;g.textAlign='center';g.lineWidth=8;g.strokeStyle='#000';g.strokeText(s,0,0);g.fillStyle=c;g.shadowColor=c;g.shadowBlur=25;g.fillText(s,0,0);g.restore()}
function drawF(f){const A=f.at,pose={t:tick,w:f.w,mv:Math.abs(f.vx)>.6&&!A,air:f.y<GY-3,blk:f.blk,hit:f.hit>0,stun:f.stun>0,a:A,ko:f.ko,glow:A&&(A.k=='s1'||A.k=='s2')};
if(A&&A.k=='s2'&&A.t>5&&A.t<22)for(let i=3;i>0;i--)hero(f.c,pose,f.x-f.face*i*28,f.y,f.face,.95,.18);
hero(f.c,pose,f.x,f.y,f.face,.95);if(f.stun>0)for(let i=0;i<3;i++){const a=tick*.15+i*2.1;circ(f.x+Math.cos(a)*22,f.y-175+Math.sin(a)*6,4,'#fe3')}
if(f.slow>0){g.strokeStyle='#fff9';g.lineWidth=1.5;for(let i=0;i<4;i++){g.beginPath();g.moveTo(f.x-30,f.y-30-i*35);g.lineTo(f.x+30,f.y-45-i*35);g.stroke()}}}
function render(){g.save();if(shake>.5)g.translate(rnd(-shake,shake),rnd(-shake,shake));bgDraw();
if(mode=='menu'){C.forEach((c,i)=>{const o={t:tick+i*20,w:0};hero(c,o,80+i*160,GY+25,i<3?1:-1,.9+(i%2)*.08)})}
if(mode=='fight'||mode=='over'){P.slice().sort((a,b)=>a.y-b.y).forEach(drawF);
for(const p of pj){g.save();g.shadowColor=p.col;g.shadowBlur=20;circ(p.x,p.y,p.sz,p.col);circ(p.x,p.y,p.sz*.5,'#fff');g.strokeStyle=p.col;g.lineWidth=p.sz;g.globalAlpha=.5;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*2,p.y);g.stroke();g.restore()}
for(const p of pt){g.globalAlpha=p.l/p.m;if(p.ring){g.strokeStyle=p.c;g.lineWidth=4;g.beginPath();g.arc(p.x,p.y,p.s*(1-p.l/p.m)*2+8,0,7);g.stroke()}else circ(p.x,p.y,p.s*(p.g?1:p.l/p.m),p.c)}g.globalAlpha=1;
g.font='bold 24px Impact';g.textAlign='center';for(const t of tx){g.globalAlpha=t.l/50;g.fillStyle=t.c;g.strokeStyle='#000';g.lineWidth=4;g.strokeText(t.s,t.x,t.y);g.fillText(t.s,t.x,t.y)}g.globalAlpha=1;
g.restore();hud();
if(mode=='fight'){if(st=='intro'){sT<60?banner('ROUND '+rd,'#fff',90):banner('FIGHT!','#ff3',110)}if(st=='end')banner(P.et,'#f33',110)}}else g.restore()}
// ---------- UI ----------
function show(id){['menu','sel','end'].forEach(k=>$('#'+k).hidden=k!=id)}
function toMenu(){mode='menu';music(0);show('menu')}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{au();SFX.ui();nP=+b.dataset.m;phase=0;pick=[0,0];openSel()});
$('#bctl').onclick=()=>{au();SFX.ui();$('#ctl').hidden=!$('#ctl').hidden};
$('#b1').onclick=()=>{SFX.ui();begin()};$('#b2').onclick=()=>{SFX.ui();phase=0;openSel()};$('#b3').onclick=()=>{SFX.ui();toMenu()};
const grid=$('#grid');C.forEach((c,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML='<canvas width="180" height="230"></canvas><div>'+c.n+'</div>';grid.appendChild(d);const cc=d.querySelector('canvas').getContext('2d');g=cc;hero(c,{t:0,w:0},90,215,1,1.05);g=cx;
d.onmouseenter=()=>{hov=i;info(i);SFX.ui()};d.onclick=()=>{au();hov=i;info(i);choose(i)}});
function info(i){const c=C[i];$('#in').textContent=c.n;$('#id').textContent=c.d;
const S=[['GÜÇ',c.pow],['HIZ',c.spd],['SAVUNMA',c.def],['DAYANIKLILIK',c.hp/13]];$('#stats').innerHTML=S.map(([n,v])=>`<div class="st"><span>${n}</span><i><u style="width:${v*10}%"></u></i></div>`).join('');
for(const k of['s1','s2'])$('#'+k).innerHTML=`<b>${k=='s1'?'H / /':'J / ;'} ${c[k].n}</b> — ${c[k].ds} <small>(${c[k].cost} enerji)</small>`;
document.querySelectorAll('.card').forEach((d,j)=>d.classList.toggle('on',j==i))}
function openSel(){mode='sel';show('sel');$('#selt').textContent=nP==2?'OYUNCU '+(phase+1)+': KARAKTERİNİ SEÇ':'KARAKTERİNİ SEÇ';info(hov)}
function choose(i){SFX.ok();pick[phase]=i;if(nP==2&&phase==0){phase=1;openSel();return}if(nP==1){let r;do r=Math.random()*6|0;while(r==i);pick[1]=r}begin()}
function begin(){au();$('#end').hidden=1;show('none');mode='fight';P=[mk(pick[0],0,0),mk(pick[1],1,nP==1)];rd=1;resetRound();music(1)}
// preview anim + loop
const pvc=$('#pv').getContext('2d');let last=0,acc=0;
function loop(ts){requestAnimationFrame(loop);acc+=Math.min(100,ts-last);last=ts;while(acc>16.67){step();acc-=16.67}render();
if(mode=='sel'){g=pvc;g.clearRect(0,0,320,200);const c=C[hov],ph=Math.floor(tick/70)%4,o={t:tick,w:0};if(ph==1)o.a={k:'p',t:(tick%70)%13,dur:13};if(ph==2)o.a={k:'k',t:(tick%70)%22,dur:22};if(ph==3)o.a={k:'s1',t:Math.min(27,tick%70),dur:28};o.glow=ph==3;hero(c,o,160,185,1,.95);g=cx}}
requestAnimationFrame(loop);
</script></body></html>
